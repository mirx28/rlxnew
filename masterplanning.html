<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Planning | RLX Design Studio</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        font-family: "DM Sans", sans-serif;
        background: #000;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        color: #fff;
        background: radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 28%),
          radial-gradient(circle at bottom, rgba(255,255,255,0.09), transparent 18%),
          #040506;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 1.5rem 1.75rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: transparent;
        border: none;
        gap: 0.5rem;
      }

      .nav-logo,
      .nav-toggler {
        padding: 0;
        cursor: pointer;
      }

      .nav-logo img {
        width: auto;
        height: 28px;
        display: block;
      }

      .nav-toggler {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
      }

      .nav-toggler span {
        width: 30px;
        height: 2px;
        background-color: rgba(255,255,255,0.92);
        transition: transform 0.4s ease, opacity 0.4s ease;
      }

      .nav-toggler.open span:first-child {
        transform: translateY(3.5px) rotate(45deg) scaleX(0.75);
      }

      .nav-toggler.open span:nth-child(2) {
        transform: translateY(-3.5px) rotate(-45deg) scaleX(0.75);
      }

      .nav-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        z-index: 19;
      }

      .nav-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        transform: scaleY(0);
        transform-origin: top;
        will-change: transform;
        pointer-events: none;
      }

      .nav-bg:nth-child(1),
      .nav-bg:nth-child(2),
      .nav-bg:nth-child(3),
      .nav-bg:nth-child(4) {
        background-color: transparent;
      }

      .nav-items {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(420px, 2fr);
        gap: 3.5rem;
        padding: 6rem 6rem;
        background-color: transparent;
        clip-path: polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%);
        will-change: clip-path;
      }

      .nav-content.open .nav-items {
        pointer-events: auto; clip-path: polygon(0 0,100% 0,100% 100%,0 100%);
        background: transparent !important; border: none !important; box-shadow: none !important; overflow: visible !important;
        -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
      }

      .nav-content.open .nav-items::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at top left, rgba(255,255,255,0.2), transparent 24%),
                    radial-gradient(circle at bottom right, rgba(200, 238, 230, 0.12), transparent 30%);
      }

      .nav-items-col {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 2rem;
      }

      .nav-items-sidebar {
        max-width: 280px;
      }

      .nav-items-main {
        justify-content: center;
      }

      .nav-items a {
        text-decoration: none;
        color: #fff;
        display: block;
        letter-spacing: -2%;
        line-height: 1.1;
        margin-bottom: 0.5rem;
      }

      .nav-socials,
      .nav-legal {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .nav-socials a,
      .nav-secondary-links {
        font-size: 1rem;
      }

      .nav-secondary-links {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
      }

      .nav-secondary-links a {
        display: inline-block;
      }

      .nav-secondary-links span {
        opacity: 0.75;
      }

      .nav-legal a {
        font-size: 0.9rem;
        color: #7f8c89;
      }

      .nav-primary-links {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        width: 100%;
        align-items: flex-start;
      }

      .nav-links-group {
        display: contents;
      }

      .nav-primary-links a {
        font-size: clamp(2rem, 3.5vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        text-decoration: none;
        color: #fff;
        display: block;
        padding: 0.1rem 0;
        transition: transform 0.35s ease, color 0.25s ease;
      }

      .nav-primary-links a:hover,
      .nav-primary-links a:focus {
        transform: translateX(10px);
        color: #dce9e1;
      }

      .nav-content a .line {
        position: relative;
        will-change: transform;
        transform: translateY(100%);
      }

      @media (max-width: 1000px) {
        .nav-content,
        .nav-items {
          height: 100svh;
        }

        .nav-items {
          flex-direction: column;
          justify-content: center;
          padding: 0 2rem;
        }

        .nav-legal,
        .nav-secondary-links {
          display: none;
        }

        .nav-items-col:nth-child(1),
        .nav-items-col:nth-child(2) {
          flex: none;
        }
      }

      .slider {
        position: relative;
        width: 100vw;
        height: 100svh;
        overflow: hidden;
      }

      .slide,
      .slide-img {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100svh;
      }

      .slide {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        will-change: transform;
      }

      .slide-img {
        z-index: 0;
      }

      .slide-img::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(4,6,8,0.15), rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.82));
        pointer-events: none;
      }

      .slide-header {
        position: absolute;
        inset: auto 0 13rem 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 0 5vw;
        gap: 1.25rem;
      }

      .slide-title h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3.5rem, 6vw, 7rem);
        font-weight: 600;
        letter-spacing: -0.08rem;
        line-height: 0.95;
        text-transform: none;
      }

      .slide-scope-tag {
        margin-top: 0.85rem;
        font-family: "Cormorant Garamond", serif;
        font-size: 1rem;
        font-style: italic;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.92;
        color: rgba(255, 255, 255, 0.88);
      }

      .slide-description {
        max-width: 42rem;
        font-family: "DM Sans", sans-serif;
        font-size: 1.05rem;
        line-height: 1.9;
        opacity: 0.92;
        letter-spacing: 0.02em;
        text-transform: none;
      }

      .slide-link a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.2rem;
        border-radius: 0.75rem;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.95);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .slide-link a:hover {
        transform: translateY(-1px);
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.18);
      }

      .slide-info {
        position: absolute;
        left: 0;
        bottom: 7.5rem;
        width: 100%;
        padding: 0 5vw;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        z-index: 2;
      }

      .slide-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        font-family: "DM Mono", monospace;
        font-size: 0.8rem;
        line-height: 1.4;
        opacity: 0.92;
        text-transform: uppercase;
      }

      .slide-tags p:first-child {
        opacity: 0.55;
        margin-right: 0.75rem;
      }

      .slide-tags p:not(:first-child) {
        opacity: 0.75;
      }

      .slide-index-wrapper {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: "DM Mono", monospace;
        font-size: 0.9rem;
        letter-spacing: 0.22em;
        opacity: 0.95;
      }

      .slide-index-wrapper p {
        font-variation-settings: 'wght' 500;
      }

.nav-content{
  position: fixed !important;

  pointer-events: none;
  z-index: 70;
}
.nav-content .nav-bg{
  position: absolute;
  inset: 0;

  pointer-events: none;
  transition: transform 0.7s cubic-bezier(0.76,0,0.24,1);

}
.nav-content .nav-bg:last-child{
  background: linear-gradient(180deg, rgba(10,12,14,0.84) 0%, rgba(10,12,14,0.56) 100%);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  box-shadow: 0 40px 120px rgba(0,0,0,0.6);
}
.nav-content.open .nav-bg{ transform: scaleY(1); }
.nav-content .nav-items{
  pointer-events: none;
  clip-path: polygon(0 0,100% 0,100% 0,0 0);
  will-change: clip-path;
  transition: clip-path 0.55s ease 0.18s;
}
.nav-content.open .nav-items{
  pointer-events: auto;
  clip-path: polygon(0 0,100% 0,100% 100%,0 100%);
  background: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  overflow: visible !important;
}
.nav-content a .line{
  position: relative;
  will-change: transform;
  transform: translateY(100%);
}

  }

<div id="rlxTransition" aria-hidden="true"><img class="rlx-brand" src="rlx-logo.webp" alt="RLX" /></div>
<style>
#rlxTransition{position:fixed;inset:0;z-index:2000;pointer-events:none;background:linear-gradient(180deg,#0b0d11 0%,#0a0c0e 55%,#10131a 100%);display:flex;align-items:center;justify-content:center;clip-path:inset(0 0 100% 0);}
#rlxTransition::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.06),transparent 55%);}
#rlxTransition .rlx-brand{width:auto;height:clamp(2.5rem,9vw,7rem);object-fit:contain;display:block;opacity:0;transform:translateY(12px);transition:opacity .5s ease .1s,transform .5s ease .1s;position:relative;}
#rlxTransition.rlx-shown .rlx-brand{opacity:1;transform:none;}
</style>
<script>
(function(){
  var t=document.getElementById('rlxTransition'); if(!t) return;
  function internal(h){ if(!h)return false; if(/^(mailto:|tel:|javascript:|#|https?:|\/\/)/.test(h))return false; try{return new URL(h,location.href).origin===location.origin;}catch(e){return false;} }
  var isBack=false; try{ var n=performance.getEntriesByType('navigation')[0]; if(n&&n.type==='back_forward') isBack=true; }catch(e){}
  var arrived=sessionStorage.getItem('rlxNav')==='1';
  window.__rlxSkipIntro = arrived || isBack;
  if(arrived||isBack){ var pl=document.querySelector('.preloader'); if(pl){pl.style.display='none';} }
  if(arrived){
    sessionStorage.removeItem('rlxNav');
    t.style.transition='none';
    t.style.clipPath='inset(0 0 0 0)';
    t.classList.add('rlx-shown');
    var revealed=false;
    function doReveal(){ if(revealed) return; revealed=true;
      requestAnimationFrame(function(){ void t.offsetWidth; t.style.transition='clip-path .8s cubic-bezier(.76,0,.24,1)'; t.style.clipPath='inset(0 0 100% 0)'; t.classList.remove('rlx-shown'); });
    }
    if(document.readyState!=='loading'){ doReveal(); }
    else { document.addEventListener('DOMContentLoaded', function(){ setTimeout(doReveal,120); }); }
    setTimeout(doReveal,1400);
  }
  window.addEventListener('pageshow', function(ev){ if(ev.persisted){ t.style.transition='none'; t.style.clipPath='inset(0 0 100% 0)'; t.classList.remove('rlx-shown'); } });
  document.addEventListener('click', function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null; if(!a)return;
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var href=a.getAttribute('href'); if(!internal(href))return;
    var dest=new URL(href,location.href).href; if(dest===location.href)return;
    e.preventDefault();
    sessionStorage.setItem('rlxNav','1');
    t.style.transition='clip-path .5s cubic-bezier(.76,0,.24,1)';
    t.style.clipPath='inset(0 0 0 0)';
    t.classList.add('rlx-shown');
    setTimeout(function(){ location.href=href; },500);
  });
})();
</script>

    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const slides = [
          {
            slideTitle: "Agar Hilltop",
            slideDescription:
              "A premium hilltop masterplan across Kasmoli, Uttarakhand — premium plots, hotel & suites, serviced apartments and curated amenities resolved within one naturally contoured destination.",
            slideUrl: "agar.html",
            slideScopeTag: "[Premium Hilltop Masterplan]",
            slideTags: ["Hilltop", "Premium Plots", "Hotel & Suites", "Terrain-Responsive"],
            slideImg: "plans/agar-hero.jpg",
          },
          {
            slideTitle: "Boutique Villas & Studio",
            slideDescription:
              "A terrain-responsive hillside masterplan at Jhaulaungi, Tehri — 20 boutique villas, studios and a clubhouse stepped naturally across a 65-metre contour drop.",
            slideUrl: "tehri.html",
            slideScopeTag: "[Boutique Hillside Masterplan]",
            slideTags: ["Boutique Villas", "Studios", "Clubhouse", "Contour-Led"],
            slideImg: "plans/tehri-hero.jpg",
          },
          {
            slideTitle: "River Retreat",
            slideDescription:
              "A low-density nature retreat across 4 acres near Pilibhit — 22 cottages woven with canal, farmland and landscape for a slower, immersive stay.",
            slideUrl: "puranpur.html",
            slideScopeTag: "[Nature Retreat Masterplan]",
            slideTags: ["Retreat", "Cottages", "Low-Density", "Farmland"],
            slideImg: "plans/kandarihero.jpg",
          },
          {
            slideTitle: "Aambagh Villa Plots",
            slideDescription:
              "A plotted residential development of 14 land parcels in Rishikesh — a consistent design language of attainable 2BHK to 4BHK duplex villas.",
            slideUrl: "ambhagh.html",
            slideScopeTag: "[Residential Plotting + Villas]",
            slideTags: ["Duplex Villas", "Plotting", "Attainable", "Design Language"],
            slideImg: "plans/ambhagh-master.jpg",
          },
        ];

        const totalSlides = slides.length;
        let currentSlide = 1;
        let isAnimating = false;
        let scrollAllowed = true;
        let lastScrollTime = 0;

        const slider = document.querySelector(".slider");

        function createSlide(slideIndex) {
          const slideData = slides[slideIndex - 1];
          const slide = document.createElement("div");
          slide.className = "slide";

          const slideImg = document.createElement("div");
          slideImg.className = "slide-img";
          const img = document.createElement("img");
          img.src = slideData.slideImg;
          img.alt = slideData.slideTitle;
          slideImg.appendChild(img);

          const slideHeader = document.createElement("div");
          slideHeader.className = "slide-header";

          const slideTitle = document.createElement("div");
          slideTitle.className = "slide-title";
          const h1 = document.createElement("h1");
          h1.textContent = slideData.slideTitle;
          slideTitle.appendChild(h1);

          if (slideData.slideScopeTag) {
            const slideScope = document.createElement("div");
            slideScope.className = "slide-scope-tag";
            slideScope.textContent = slideData.slideScopeTag;
            slideTitle.appendChild(slideScope);
          }

          const slideDescription = document.createElement("div");
          slideDescription.className = "slide-description";
          const p = document.createElement("p");
          p.textContent = slideData.slideDescription;
          slideDescription.appendChild(p);

          const slideLink = document.createElement("div");
          slideLink.className = "slide-link";
          const a = document.createElement("a");
          a.href = slideData.slideUrl;
          a.textContent = "View Project";
          slideLink.appendChild(a);

          slideHeader.append(slideTitle, slideDescription, slideLink);

          const slideInfo = document.createElement("div");
          slideInfo.className = "slide-info";

          const slideTags = document.createElement("div");
          slideTags.className = "slide-tags";
          const tagsLabel = document.createElement("p");
          tagsLabel.textContent = "Tags";
          slideTags.appendChild(tagsLabel);

          slideData.slideTags.forEach((tag) => {
            const tagP = document.createElement("p");
            tagP.textContent = tag;
            slideTags.appendChild(tagP);
          });

          const slideIndexWrapper = document.createElement("div");
          slideIndexWrapper.className = "slide-index-wrapper";
          const slideIndexCopy = document.createElement("p");
          slideIndexCopy.textContent = String(slideIndex).padStart(2, "0");
          const slideIndexSeparator = document.createElement("p");
          slideIndexSeparator.textContent = "/";
          const slidesTotalCount = document.createElement("p");
          slidesTotalCount.textContent = String(totalSlides).padStart(2, "0");

          slideIndexWrapper.append(slideIndexCopy, slideIndexSeparator, slidesTotalCount);
          slideInfo.append(slideTags, slideIndexWrapper);

          slide.append(slideImg, slideHeader, slideInfo);
          return slide;
        }

        function splitText(slide) {
          const slideHeader = slide.querySelector(".slide-title h1");
          if (slideHeader && window.SplitText) {
            SplitText.create(slideHeader, {
              type: "words",
              wordsClass: "word",
              mask: "words",
            });
          }

          const slideContent = slide.querySelectorAll("p, a");
          slideContent.forEach((element) => {
            if (window.SplitText) {
              SplitText.create(element, {
                type: "lines",
                linesClass: "line",
                mask: "lines",
                reduceWhiteSpace: false,
              });
            }
          });
        }

        function animateSlide(direction) {
          if (isAnimating || !scrollAllowed) return;
          isAnimating = true;
          scrollAllowed = false;

          const currentSlideElement = slider.querySelector(".slide");

          if (direction === "down") {
            currentSlide = currentSlide === totalSlides ? 1 : currentSlide + 1;
          } else {
            currentSlide = currentSlide === 1 ? totalSlides : currentSlide - 1;
          }

          const exitY = direction === "down" ? "-200vh" : "200vh";
          const entryY = direction === "down" ? "100vh" : "-100vh";
          const entryClipPath =
            direction === "down"
              ? "polygon(20% 20%, 80% 20%, 80% 100%, 20% 100%)"
              : "polygon(20% 0%, 80% 0%, 80% 80%, 20% 80%)";

          gsap.to(currentSlideElement, {
            scale: 0.9,
            opacity: 0,
            rotation: 12,
            y: exitY,
            duration: 1.0,
            ease: "power4.inOut",
            force3D: true,
            onComplete: () => {
              currentSlideElement.remove();
            },
          });

          setTimeout(() => {
            const newSlide = createSlide(currentSlide);
            gsap.set(newSlide, {
              y: entryY,
              clipPath: entryClipPath,
              force3D: true,
            });
            slider.appendChild(newSlide);
            splitText(newSlide);

            const words = newSlide.querySelectorAll(".word");
            const lines = newSlide.querySelectorAll(".line");
            gsap.set([...words, ...lines], { y: "100%", force3D: true });

            gsap.to(newSlide, {
              y: 0,
              clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
              duration: 1.0,
              ease: "power4.out",
              force3D: true,
              onStart: () => {
                const tl = gsap.timeline();
                tl.to(newSlide.querySelectorAll(".slide-title .word"), {
                  y: "0%",
                  duration: 1,
                  ease: "power4.out",
                  stagger: 0.1,
                  force3D: true,
                }, 0.75);

                tl.to(newSlide.querySelectorAll(".slide-tags .line"), {
                  y: "0%",
                  duration: 1,
                  ease: "power4.out",
                  stagger: 0.1,
                }, "-=0.75");

                tl.to(newSlide.querySelectorAll(".slide-index-wrapper .line"), {
                  y: "0%",
                  duration: 1,
                  ease: "power4.out",
                  stagger: 0.1,
                }, "<");

                tl.to(newSlide.querySelectorAll(".slide-description .line"), {
                  y: "0%",
                  duration: 1,
                  ease: "power4.out",
                  stagger: 0.05,
                }, "<");

                tl.to(newSlide.querySelectorAll(".slide-link .line"), {
                  y: "0%",
                  duration: 1,
                  ease: "power4.out",
                }, "-=1");
              },
              onComplete: () => {
                isAnimating = false;
                setTimeout(() => {
                  scrollAllowed = true;
                  lastScrollTime = Date.now();
                }, 100);
              },
            });
          }, 380);
        }

        function handleScroll(direction) {
          const now = Date.now();
          if (isAnimating || !scrollAllowed) return;
          if (now - lastScrollTime < 470) return;
          lastScrollTime = now;
          animateSlide(direction);
        }

        function attachEvents() {
          window.addEventListener(
            "wheel",
            (e) => {
              e.preventDefault();
              const direction = e.deltaY > 0 ? "down" : "up";
              handleScroll(direction);
            },
            { passive: false }
          );

          let touchStartY = 0;
          let isTouchActive = false;

          window.addEventListener(
            "touchstart",
            (e) => {
              touchStartY = e.touches[0].clientY;
              isTouchActive = true;
            },
            { passive: false }
          );

          window.addEventListener(
            "touchmove",
            (e) => {
              e.preventDefault();
              if (!isTouchActive || isAnimating || !scrollAllowed) return;
              const touchCurrentY = e.touches[0].clientY;
              const difference = touchStartY - touchCurrentY;
              if (Math.abs(difference) > 50) {
                isTouchActive = false;
                const direction = difference > 0 ? "down" : "up";
                handleScroll(direction);
              }
            },
            { passive: false }
          );

          window.addEventListener("touchend", () => {
            isTouchActive = false;
          });
        }

        function setupOverlayMenu() {

          const toggler = document.querySelector(".nav-toggler");

          const navContent = document.querySelector(".nav-content");

          if (!toggler || !navContent) return;


          let splitDone = false;

          function ensureSplit() {

            if (splitDone || !window.SplitText) return;

            try {

              SplitText.create(".nav-items a", { type: "lines", mask: "lines", linesClass: "line" });

              splitDone = true;

            } catch (e) {}

          }


          toggler.addEventListener("click", function () {

            const willOpen = !navContent.classList.contains("open");

            toggler.classList.toggle("open");

            navContent.classList.toggle("open");

            if (willOpen) {

              ensureSplit();

              if (window.SplitText) {

                gsap.fromTo(

                  ".nav-items a .line",

                  { y: "100%" },

                  { y: "0%", duration: 0.7, stagger: 0.06, ease: "power3.out", delay: 0.55 }

                );

              }

            }

          });

        }

        const firstSlide = createSlide(currentSlide);
        slider.appendChild(firstSlide);
        splitText(firstSlide);
        attachEvents();
        setupOverlayMenu();
      });
    </script>
  </body>
</html>
